name: Coaching and numeric regression
on:
  push:
    branches: [main, feat/life-first-coaching]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: coaching-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -r requirements-web.lock -e '.[dev]'
      - name: Check frontend syntax
        run: node --check workbench/static/coach.js
      - name: Run all numeric, coaching and web regressions
        run: python -m pytest tests tests_web -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-web.lock -e '.[dev]' 'playwright>=1.50,<2'
      - run: python -m playwright install --with-deps chromium
      - name: Real browser desktop and mobile coaching flow
        run: python qa/coaching_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coaching-browser
          path: qa/coaching-browser-*
