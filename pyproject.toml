[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyfin-fdt-workbench"
version = "0.2.0"
description = "Local frontend and numeric Financial Digital Twin engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3", "jsonschema>=4.18,<5", "fastapi>=0.128,<1", "uvicorn>=0.48,<1", "python-multipart>=0.0.29,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "httpx>=0.28,<1", "psutil>=7,<8"]

[project.scripts]
fdt = "fdt.cli:main"

[tool.setuptools.packages.find]
include = ["fdt*", "workbench*"]

[tool.setuptools.package-data]
fdt = ["schemas/*.json"]
workbench = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_web"]
addopts = "-ra"
